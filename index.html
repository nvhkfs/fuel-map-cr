<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Ceny paliv ČR</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet"/>
<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<style>
/* ═══════════════════════════════════════════
   TOKENS & THEME
═══════════════════════════════════════════ */
:root {
  --bg:        #ffffff;
  --bg2:       #f2f2f7;
  --bg3:       #e5e5ea;
  --surface:   rgba(255,255,255,0.96);
  --surface2:  rgba(242,242,247,0.95);
  --border:    rgba(0,0,0,0.10);
  --text1:     #000000;
  --text2:     #3c3c43;
  --text3:     #8e8e93;
  --text4:     #aeaeb2;
  --green:     #2e7d32;
  --blue:      #007AFF;
  --separator: rgba(0,0,0,0.08);
  --shadow-sm: 0 1px 6px rgba(0,0,0,0.12);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.14);
  --shadow-lg: 0 -4px 30px rgba(0,0,0,0.15);
  --tab-active:#ffffff;
  --tab-shadow:0 1px 4px rgba(0,0,0,0.16);
  --handle:    #d1d1d6;
  --map-style: 'mapbox://styles/mapbox/streets-v12';
  --star:      #FF9500;
}
[data-theme="dark"] {
  --bg:        #1c1c1e;
  --bg2:       #2c2c2e;
  --bg3:       #3a3a3c;
  --surface:   rgba(28,28,30,0.97);
  --surface2:  rgba(44,44,46,0.97);
  --border:    rgba(255,255,255,0.10);
  --text1:     #ffffff;
  --text2:     #ebebf5;
  --text3:     #8e8e93;
  --text4:     #636366;
  --green:     #30d158;
  --blue:      #0a84ff;
  --separator: rgba(255,255,255,0.07);
  --shadow-sm: 0 1px 6px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.5);
  --shadow-lg: 0 -4px 30px rgba(0,0,0,0.6);
  --tab-active:#3a3a3c;
  --tab-shadow:0 1px 4px rgba(0,0,0,0.4);
  --handle:    #48484a;
  --star:      #FF9F0A;
}

/* ═══════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; }
body {
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  overflow:hidden; position:fixed; inset:0;
  background:var(--bg2);
  color:var(--text1);
  transition:background 0.3s, color 0.3s;
}

/* ═══════════════════════════════════════════
   MAP
═══════════════════════════════════════════ */
#map { position:absolute; inset:0; }
.mapboxgl-ctrl-attrib, .mapboxgl-ctrl-logo { display:none !important; }
.mapboxgl-ctrl-top-right { margin-top:calc(var(--header-h, 180px) + 16px) !important; margin-right:10px !important; }

/* ═══════════════════════════════════════════
   HEADER
═══════════════════════════════════════════ */
#header {
  position:absolute; top:0; left:0; right:0; z-index:100;
  background:var(--surface);
  backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-bottom:0.5px solid var(--border);
  padding:0 14px 10px;
  padding-top:calc(env(safe-area-inset-top) + 10px);
  transition:background 0.3s, border-color 0.3s;
}

/* Row 1: title + action buttons */
.hrow1 {
  display:flex; align-items:center; justify-content:space-between;
  gap:8px; margin-bottom:8px;
}
.htitle { font-size:16px; font-weight:700; color:var(--text1); letter-spacing:-0.3px; line-height:1.2; }
.hsub   { font-size:10px; color:var(--text3); margin-top:1px; }

.hbtns { display:flex; align-items:center; gap:6px; flex-shrink:0; }

/* Row 2: fuel toggle + theme toggle */
.hrow2 { display:flex; align-items:center; gap:8px; margin-bottom:8px; }

/* Segment control base */
.seg {
  display:flex; background:var(--bg2); border-radius:9px; padding:2px; flex-shrink:0;
  transition:background 0.3s;
}
.seg-btn {
  padding:5px 11px; border-radius:7px; font-size:12px; font-weight:600;
  color:var(--text3); cursor:pointer; transition:all 0.2s; white-space:nowrap;
  border:none; background:none; font-family:inherit;
}
.seg-btn.on {
  background:var(--tab-active); color:var(--text1);
  box-shadow:var(--tab-shadow);
}

/* Theme toggle button */
#theme-btn {
  width:32px; height:32px; border-radius:50%; border:none; cursor:pointer;
  background:var(--bg2); display:flex; align-items:center; justify-content:center;
  font-size:16px; flex-shrink:0; transition:background 0.3s, transform 0.15s;
}
#theme-btn:active { transform:scale(0.88); }

/* GPS button */
#gps-btn {
  width:32px; height:32px; border-radius:50%; background:var(--blue); border:none;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:0 2px 8px rgba(0,122,255,0.4); flex-shrink:0;
  transition:transform 0.15s, background 0.2s;
}
#gps-btn:active { transform:scale(0.88); }

/* Address search */
.search-wrap {
  position:relative; display:flex; align-items:center; margin-bottom:8px;
}
#addr-input {
  width:100%; height:34px; border-radius:10px; border:none;
  background:var(--bg2); color:var(--text1);
  font-size:14px; font-family:inherit;
  padding:0 36px 0 12px;
  outline:none; transition:background 0.3s, box-shadow 0.2s;
  -webkit-appearance:none;
}
#addr-input:focus { box-shadow:0 0 0 2px var(--blue); }
#addr-input::placeholder { color:var(--text3); }
#addr-clear {
  position:absolute; right:10px; width:18px; height:18px; border-radius:50%;
  background:var(--text4); border:none; color:#fff; font-size:11px;
  display:none; align-items:center; justify-content:center; cursor:pointer;
  font-family:inherit; line-height:1;
}
#addr-clear.vis { display:flex; }

/* Autocomplete dropdown */
#autocomplete {
  position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:200;
  background:var(--bg); border-radius:12px; box-shadow:var(--shadow-md);
  overflow:hidden; display:none;
  border:0.5px solid var(--border);
}
#autocomplete.vis { display:block; }
.ac-item {
  padding:11px 14px; font-size:14px; color:var(--text1); cursor:pointer;
  border-bottom:0.5px solid var(--separator); transition:background 0.1s;
  display:flex; align-items:flex-start; gap:10px;
}
.ac-item:last-child { border-bottom:none; }
.ac-item:active, .ac-item:hover { background:var(--bg2); }
.ac-icon { color:var(--text3); margin-top:1px; font-size:14px; flex-shrink:0; }
.ac-main { font-size:14px; }
.ac-sub  { font-size:11px; color:var(--text3); margin-top:1px; }

/* Cheapest rows */
#info-rows { display:flex; flex-direction:column; gap:3px; }
.info-row {
  display:flex; align-items:center; flex-wrap:wrap; gap:4px;
  font-size:11.5px; color:var(--text2); line-height:1.4;
}
.info-label {
  font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.07em;
  color:var(--text3); white-space:nowrap; margin-right:2px;
}
.info-type {
  font-size:11px; font-weight:700; color:var(--green); flex-shrink:0; margin-right:5px;
}
.info-price { font-weight:700; color:var(--green); font-size:13px; margin-right:4px; }
.info-gap   { width:8px; flex-shrink:0; }
.info-networks { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
.info-inline {
  display:flex; align-items:center; gap:4px; flex-wrap:wrap; flex:1;
}
.net-chip {
  display:inline-flex; align-items:center; gap:3px;
  background:var(--bg2); border-radius:5px; padding:1px 5px;
  font-size:10px; font-weight:700; color:var(--text2);
  transition:background 0.3s; margin-left:2px;
}
.net-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.no-data { font-size:11px; color:var(--text3); font-style:italic; }

/* Radius ring on map */
#radius-layer { pointer-events:none; }

/* ═══════════════════════════════════════════
   BOTTOM SHEET PANEL
═══════════════════════════════════════════ */
#panel {
  position:absolute; bottom:0; left:0; right:0; z-index:200;
  background:var(--bg);
  border-radius:20px 20px 0 0;
  box-shadow:var(--shadow-lg);
  transform:translateY(100%);
  transition:transform 0.32s cubic-bezier(0.32,0.72,0,1), background 0.3s;
  padding:0 18px 20px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
  max-height:78vh; overflow-y:auto;
}
#panel.show { transform:translateY(0); }
.handle {
  width:36px; height:4px; background:var(--handle); border-radius:2px;
  margin:10px auto 2px; cursor:pointer;
}
#paccent { height:3px; border-radius:3px; margin:10px 0 12px; }
.ptitle  { font-size:18px; font-weight:700; color:var(--text1); letter-spacing:-0.4px; }
.paddr   { font-size:13px; color:var(--text3); margin:3px 0 4px; }
.pfuel   { font-size:11px; color:var(--text3); margin-bottom:14px; }
.pdivider { height:0.5px; background:var(--separator); margin:12px 0; }
.price-grid { display:flex; gap:14px; flex-wrap:wrap; }
.panel-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:auto auto;
  gap:14px 12px;
  margin-bottom:6px;
}
.pg-name { grid-column:1; grid-row:1; min-width:0; }
.pg-nav  { grid-column:2; grid-row:1; display:flex; flex-direction:column; align-items:flex-start; }
.pg-pub  { grid-column:1; grid-row:2; }
.pg-dkv  { grid-column:2; grid-row:2; }
.price-block { flex:1; min-width:0; text-align:left; }
.plabel { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; margin-bottom:5px; }
.pval   { font-size:36px; font-weight:700; letter-spacing:-1.5px; line-height:1; }
.punit  { font-size:12px; color:var(--text3); margin-top:3px; }
.pnovat { font-size:11px; color:var(--text4); margin-top:2px; }
.pnote  { font-size:10px; color:var(--text4); margin-top:14px; line-height:1.5; }
.nav-section { margin-top:14px; }
.nav-label {
  font-size:10px; font-weight:700; color:var(--text3);
  letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px;
}
.nav-icon {
  width:58px; height:58px; border-radius:13px; border:none;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:opacity 0.15s, transform 0.12s;
  box-shadow:0 2px 8px rgba(0,0,0,0.18); flex-shrink:0;
  background:none; padding:0; overflow:hidden;
}
.nav-icon svg, .nav-icon img { width:58px; height:58px; border-radius:13px; display:block; }
.nav-icon:active { opacity:0.8; transform:scale(0.93); }
.nav-wrap { display:flex; gap:10px; align-items:center; }
.drow {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 0; border-bottom:0.5px solid var(--separator);
}
.drow:last-child { border:none; }
.dname  { font-size:14px; color:var(--text1); }
.dmain  { font-size:16px; font-weight:600; color:var(--text1); text-align:right; }
.dsub   { font-size:10px; color:var(--text4); display:block; text-align:right; margin-top:1px; }

/* ═══════════════════════════════════════════
   PULSE ANIMATION
═══════════════════════════════════════════ */
@keyframes pulse-ring {
  0%   { transform:scale(1); opacity:.7; }
  70%  { transform:scale(2.1); opacity:0; }
  100% { transform:scale(2.1); opacity:0; }
}
@keyframes pulse-pref {
  0%   { transform:scale(1); opacity:.6; }
  60%  { transform:scale(2.4); opacity:0; }
  100% { transform:scale(2.4); opacity:0; }
}

/* ═══════════════════════════════════════════
   USER DOT
═══════════════════════════════════════════ */
.user-dot {
  width:18px; height:18px; border-radius:50%;
  background:var(--blue); border:3px solid #fff;
  box-shadow:0 2px 10px rgba(0,122,255,.55);
}

/* ═══════════════════════════════════════════
   PRICE LABEL BUBBLES (map)
═══════════════════════════════════════════ */
.map-label {
  border-radius:7px; padding:3px 7px; line-height:1.55;
  box-shadow:var(--shadow-sm);
}
[data-theme="light"] .map-label { background:rgba(255,255,255,0.95); }
[data-theme="dark"]  .map-label { background:rgba(40,40,42,0.97); border:0.5px solid rgba(255,255,255,0.1); }

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
#toast {
  position:absolute; bottom:calc(20px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--text1); color:var(--bg); font-size:13px; font-weight:500;
  padding:9px 18px; border-radius:20px; z-index:999;
  opacity:0; transition:opacity 0.25s, transform 0.25s; white-space:nowrap;
  pointer-events:none;
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>

</head>
<body>
<div id="map"></div>

<div id="header">
  <div class="hrow1">
    <div>
      <div class="htitle">Ceny paliv ČR</div>
      <div class="hsub" id="sub"></div>
    </div>
    <div class="hbtns">
      <button id="theme-btn" onclick="toggleTheme()" title="Denní / noční režim">🌙</button>
      <button id="gps-btn" onclick="locateUser()" title="Moje poloha">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
          <circle cx="12" cy="12" r="7" stroke-opacity=".35"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="hrow2">
    <div class="seg" id="fuel-seg">
      <button class="seg-btn on" data-f="benzin" onclick="setFuel('benzin')">Benzín 95</button>
      <button class="seg-btn"    data-f="nafta"  onclick="setFuel('nafta')">Nafta</button>
    </div>
    <div class="seg" id="radius-seg">
      <button class="seg-btn" data-r="2" onclick="setRadius(2)">2 km</button>
      <button class="seg-btn on" data-r="5" onclick="setRadius(5)">5 km</button>
      <button class="seg-btn" data-r="10" onclick="setRadius(10)">10 km</button>
    </div>
  </div>
  <div class="search-wrap" style="position:relative;">
    <input id="addr-input" type="text" placeholder="🔍  Zadej adresu v ČR…" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button id="addr-clear" onclick="clearSearch()">✕</button>
    <div id="autocomplete"></div>
  </div>
  <div id="info-rows">
    <div class="info-row" id="row-pref">
      <span class="info-label">⭐ Oblíbené</span>
      <div class="info-inline" id="pref-txt"><span class="no-data">— určete polohu</span></div>
    </div>
    <div class="info-row" id="row-cheap">
      <span class="info-label">💰 Nejlevnější</span>
      <div class="info-inline" id="cheap-txt"><span class="no-data">— určete polohu</span></div>
    </div>
  </div>
</div>

<div id="panel">
  <div class="handle" id="handle"></div>
  <div id="paccent"></div>
  <div id="pbody"></div>
</div>
<div id="toast"></div>

<script>

  new Date().toLocaleDateString('cs-CZ',{weekday:'long',day:'numeric',month:'long'}) + ' · klepni na stanici';

let acTimeout = null;

  {net:"mol",lng:16.2434,lat:49.5612,name:"MOL – Havlíčkův Brod",addr:"Dobrovského, Havlíčkův Brod"},
  {net:"omv",lng:16.2589,lat:49.5534,name:"OMV – Havlíčkův Brod",addr:"Humpolecká, Havlíčkův Brod"},

];


let STATIONS = [];

const DKV_B = [
  {rank:'1.', name:'F1 / TT Petrol',   wv:'38,60', nv:'31,90'},
  {rank:'2.', name:'Tank ONO',          wv:'39,26', nv:'32,45'},

];


// ── HELPERS ──────────────────────────────────────────────────────
const netById = id => NETWORKS.find(n => n.id === id);
function fmt(v)   { return v == null ? '—' : v.toFixed(2).replace('.',','); }
function noVat(v) { return v == null ? '—' : (v/1.21).toFixed(2).replace('.',','); }
function getPrices(s) {
  const n = netById(s.net); if (!n) return {pub:null,dkv:null};
  return activeFuel==='benzin' ? {pub:n.pub_b,dkv:n.dkv_b} : {pub:n.pub_n,dkv:n.dkv_n};
}
function bestPrice(s) {
  const {pub,dkv}=getPrices(s);
  if (!pub) return null;
  return (dkv!==null && dkv<pub) ? dkv : pub;
}
function dist(lng1,lat1,lng2,lat2) {
  const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function stationsInRadius(refLng,refLat,km) {
  return STATIONS.filter(s => dist(refLng,refLat,s.lng,s.lat)<=km);
}

// ── STATIONS FILTER ──────────────────────────────────────────────
function fetchStations(centerLng, centerLat) {
  const sorted = [...STATIONS_ALL].sort((a,b) =>
    dist(centerLng,centerLat,a.lng,a.lat) - dist(centerLng,centerLat,b.lng,b.lat));
  // Always show at least 10 nearest, plus everything within 40km
  const within40 = sorted.filter(s => dist(centerLng,centerLat,s.lng,s.lat) <= 40);
  const top10 = sorted.slice(0, 10);
  const combined = [...within40];
  top10.forEach(s => { if (!combined.includes(s)) combined.push(s); });
  STATIONS = combined;
  refreshMarkers();
}

// ── HEADER INFO ROWS ─────────────────────────────────────────────
function updateInfoRows() {
  const prefTxt  = document.getElementById('pref-txt');
  const cheapTxt = document.getElementById('cheap-txt');
  if (userLng === null) {
    prefTxt.innerHTML  = '<span class="no-data">— určete polohu</span>';
    cheapTxt.innerHTML = '<span class="no-data">— určete polohu</span>';
    return;
  }
  const nearby = stationsInRadius(userLng, userLat, activeRadius);

  function renderRow(el, minVal, stations) {
    const seen = new Set(); const winners = [];
    stations.forEach(s => {
      const {pub,dkv} = getPrices(s);
      const isDkv = dkv!==null && dkv<pub;
      const best = isDkv ? dkv : pub;
      const n = netById(s.net);
      if (!n||!best||Math.abs(best-minVal)>0.01||seen.has(n.id)) return;
      seen.add(n.id); winners.push({n, type:isDkv?'DKV':'PUB'});
    });
    const priceType = winners.length ? winners[0].type : 'PUB';
    el.innerHTML =
      '<span class="info-type">' + priceType + '</span>' +
      '<span class="info-price">' + fmt(minVal) + ' Kč/l</span>' +
      winners.map(w => '<span class="net-chip"><span class="net-dot" style="background:' + w.n.color + '"></span>' + w.n.short + '</span>').join('');
  }

  let minAll = Infinity;
  nearby.forEach(s => { const b=bestPrice(s); if(b&&b<minAll) minAll=b; });
  if (minAll===Infinity) cheapTxt.innerHTML='<span class="no-data">— žádné stanice v 5 km</span>';
  else renderRow(cheapTxt, minAll, nearby);

  const prefNearby = nearby.filter(s => PREF_IDS.includes(s.net));
  let minPref = Infinity;
  prefNearby.forEach(s => { const b=bestPrice(s); if(b&&b<minPref) minPref=b; });
  if (minPref===Infinity) prefTxt.innerHTML='<span class="no-data">— není v 5 km</span>';
  else renderRow(prefTxt, minPref, prefNearby);
}

// ── MARKERS ──────────────────────────────────────────────────────
function refreshMarkers() {
  markers.forEach(m => m.remove()); markers = [];

  let prefMin5km = Infinity;
  if (userLng !== null) {
    STATIONS.forEach(s => {
      if (!PREF_IDS.includes(s.net)) return;
      if (dist(userLng,userLat,s.lng,s.lat) > activeRadius) return;
      const b = bestPrice(s); if (b&&b<prefMin5km) prefMin5km=b;
    });
  }

  STATIONS.forEach(s => {
    const net = netById(s.net); if (!net) return;
    const {pub,dkv} = getPrices(s);
    if (!pub) return;
    const isDkv = dkv!==null && dkv<pub;
    const bestVal = isDkv ? dkv : pub;
    const pubBetter = !isDkv;
    const inRadius5 = userLng!==null && dist(userLng,userLat,s.lng,s.lat)<=activeRadius;
    const isPrefWinner = inRadius5 && PREF_IDS.includes(s.net) && prefMin5km<Infinity && Math.abs(bestVal-prefMin5km)<0.01;

    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;align-items:center;gap:5px;cursor:pointer;';

    const pw = document.createElement('div');
    pw.style.cssText = 'position:relative;width:36px;height:36px;flex-shrink:0;';

    if (isPrefWinner) {
      const r2 = document.createElement('div');
      r2.style.cssText = 'position:absolute;inset:-8px;border-radius:50%;background:' + net.color + ';opacity:.22;animation:pulse-pref 2s ease-out infinite .4s;';
      const r1 = document.createElement('div');
      r1.style.cssText = 'position:absolute;inset:-4px;border-radius:50%;background:' + net.color + ';opacity:.45;animation:pulse-pref 2s ease-out infinite;';
      pw.appendChild(r2); pw.appendChild(r1);
    }

    const dot = document.createElement('div');
    dot.style.cssText = 'position:relative;z-index:1;width:36px;height:36px;border-radius:50%;background:' + net.color + ';border:' + (isPrefWinner?'3':'2.5') + 'px solid #fff;box-shadow:' + (isPrefWinner ? '0 0 0 2px '+net.color+',0 3px 12px rgba(0,0,0,.4)' : '0 2px 8px rgba(0,0,0,.35)') + ';display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:' + net.tc + ';letter-spacing:-.3px;';
    dot.textContent = net.short;
    pw.appendChild(dot);

    const lbl = document.createElement('div');
    lbl.className = 'map-label';
    const pubC = pubBetter ? 'var(--green)' : 'var(--text3)';
    const dkvC = !pubBetter ? 'var(--green)' : 'var(--text3)';
    lbl.innerHTML =
      '<div style="font-size:10px;font-weight:' + (pubBetter?800:600) + ';color:' + pubC + ';">PUB ' + fmt(pub) + '</div>' +
      (dkv!==null ? '<div style="font-size:10px;font-weight:' + (!pubBetter?800:600) + ';color:' + dkvC + ';">DKV ' + fmt(dkv) + '</div>' : '');

    wrap.appendChild(pw); wrap.appendChild(lbl);

    wrap.addEventListener('click', function(e) {
      e.stopPropagation();
      const fl = activeFuel==='benzin'?'Natural 95':'Motorová nafta';
      const strop = activeFuel==='benzin'?'42,79':'44,15';
      const googleUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + s.lat + ',' + s.lng + '&travelmode=driving';
      const wazeUrl   = 'https://waze.com/ul?ll=' + s.lat + ',' + s.lng + '&navigate=yes';
      function pb(label, val, green) {
        if (!val) return '';
        const c = green ? 'var(--green)' : 'var(--text1)';
        const lc = green ? 'var(--green)' : 'var(--text3)';
        return '<div class="price-block"><div class="plabel" style="color:' + lc + '">' + label + '</div><div class="pval" style="color:' + c + '">' + fmt(val) + '</div><div class="punit">Kč/l s DPH</div>' + (val ? '<div class="pnovat">bez DPH: ' + noVat(val) + ' Kč</div>' : '') + '</div>';
      }
      showPanel(
        '<div class="panel-grid">' +
          '<div class="pg-name">' +
            '<div class="ptitle">' + s.name + '</div>' +
            '<div class="paddr">' + s.addr + '</div>' +
            '<div class="pfuel">' + fl + '</div>' +
          '</div>' +
          '<div class="pg-nav">' +
            '<div class="nav-label">NAVIGOVAT</div>' +
            '<div class="nav-wrap">' +
              '<button class="nav-icon" data-url="' + googleUrl + '" title="Google Mapy">' + GM_ICON_HTML + '</button>' +
              '<button class="nav-icon" data-url="' + wazeUrl + '" title="Waze">' + WZ_ICON_HTML + '</button>' +
            '</div>' +
          '</div>' +
          '<div class="pg-pub">' + pb('Veřejná cena', pub, pubBetter) + '</div>' +
          '<div class="pg-dkv">' + pb('DKV cena', dkv, !pubBetter) + '</div>' +
        '</div>' +
        '<div class="pnote">PUB: mBenzin.cz · aktualizováno 01. 05. 2026<br>Cenový strop MF: ' + strop + ' Kč/l · 28. 4. 2026</div>',
        net.color
      );
    });

    const mk = new mapboxgl.Marker({element:wrap,anchor:'left'}).setLngLat([s.lng,s.lat]).addTo(map);
    markers.push(mk);
  });

  updateInfoRows();
}

// ── PANEL ────────────────────────────────────────────────────────
const panel   = document.getElementById('panel');
const pbody   = document.getElementById('pbody');
const paccent = document.getElementById('paccent');
function showPanel(html,color) {
  paccent.style.background=color; pbody.innerHTML=html; panel.classList.add('show');
  pbody.querySelectorAll('.nav-icon[data-url]').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      window.open(this.dataset.url, '_blank');
    });
  });
}
function hidePanel() { panel.classList.remove('show'); }
document.getElementById('handle').addEventListener('click', hidePanel);

// ── FUEL TOGGLE ──────────────────────────────────────────────────
function setFuel(f) {
  activeFuel = f;
  document.querySelectorAll('#fuel-seg .seg-btn').forEach(b => b.classList.toggle('on', b.dataset.f===f));
  refreshMarkers();
  if (panel.classList.contains('show')) hidePanel();
}

// ── RADIUS TOGGLE ────────────────────────────────────────────────
function setRadius(r) {
  activeRadius = r;
  document.querySelectorAll('#radius-seg .seg-btn').forEach(b => b.classList.toggle('on', parseInt(b.dataset.r)===r));
  drawRadius();
  updateInfoRows();
}

// ── THEME TOGGLE ─────────────────────────────────────────────────
function toggleTheme() {
  darkMode = !darkMode;
  document.documentElement.setAttribute('data-theme', darkMode?'dark':'light');
  document.getElementById('theme-btn').textContent = darkMode ? '🌙' : '☀️';
  if (map) {
    map.setStyle(darkMode ? 'mapbox://styles/mapbox/dark-v11' : 'mapbox://styles/mapbox/streets-v12');
    map.once('style.load', () => { refreshMarkers(); drawRadius(); });
  }
}

// ── USER POSITION ────────────────────────────────────────────────
function setUserPos(lng, lat) {
  userLng = lng; userLat = lat;
  if (userMarker) userMarker.remove();
  const el = document.createElement('div');
  el.className = 'user-dot';
  userMarker = new mapboxgl.Marker({element:el}).setLngLat([lng,lat]).addTo(map);
  drawRadius();
  fetchStations(lng, lat);
}

function locateUser() {
  if (!navigator.geolocation) { showToast('Geolokace není k dispozici'); return; }
  const btn = document.getElementById('gps-btn');
  btn.style.background = '#34C759';
  navigator.geolocation.getCurrentPosition(pos => {
    const {longitude:lng, latitude:lat} = pos.coords;
    map.flyTo({center:[lng,lat], zoom:13.5, duration:1400});
    setUserPos(lng, lat);
    btn.style.background = 'var(--blue)';
  }, () => {
    btn.style.background = 'var(--blue)';
    showToast('Nelze zjistit polohu');
  });
}

// ── RADIUS CIRCLE ────────────────────────────────────────────────
function drawRadius() {
  if (!userLng||!map) return;
  const id='radius5km';
  if (map.getLayer(id)) map.removeLayer(id);
  if (map.getLayer(id+'line')) map.removeLayer(id+'line');
  if (map.getSource(id)) map.removeSource(id);
  const pts=[],steps=64,R=activeRadius/6371;
  for(let i=0;i<=steps;i++){
    const a=(i/steps)*2*Math.PI;
    const lat2=Math.asin(Math.sin(userLat*Math.PI/180)*Math.cos(R)+Math.cos(userLat*Math.PI/180)*Math.sin(R)*Math.cos(a));
    const lng2=userLng*Math.PI/180+Math.atan2(Math.sin(a)*Math.sin(R)*Math.cos(userLat*Math.PI/180),Math.cos(R)-Math.sin(userLat*Math.PI/180)*Math.sin(lat2));
    pts.push([lng2*180/Math.PI,lat2*180/Math.PI]);
  }
  map.addSource(id,{type:'geojson',data:{type:'Feature',geometry:{type:'Polygon',coordinates:[pts]}}});
  map.addLayer({id,type:'fill',source:id,paint:{'fill-color':'#007AFF','fill-opacity':darkMode?0.08:0.06}});
  map.addLayer({id:id+'line',type:'line',source:id,paint:{'line-color':'#007AFF','line-width':1.5,'line-opacity':0.5,'line-dasharray':[4,3]}});
}

// ── ADDRESS SEARCH ────────────────────────────────────────────────
const addrInput = document.getElementById('addr-input');
const addrClear = document.getElementById('addr-clear');
const acBox     = document.getElementById('autocomplete');

addrInput.addEventListener('input', () => {
  const q = addrInput.value.trim();
  addrClear.classList.toggle('vis', q.length>0);
  clearTimeout(acTimeout);
  if (q.length<2) { acBox.classList.remove('vis'); return; }
  acTimeout = setTimeout(() => geocodeSearch(q), 320);
});
addrInput.addEventListener('keydown', e => {
  if (e.key==='Escape') clearSearch();
  if (e.key==='Enter') { const f=acBox.querySelector('.ac-item'); if(f) f.click(); }
});
function clearSearch() {
  addrInput.value=''; addrClear.classList.remove('vis');
  acBox.classList.remove('vis'); acBox.innerHTML=''; addrInput.blur();
}
async function geocodeSearch(q) {
  try {
    const url = 'https://api.mapbox.com/geocoding/v5/mapbox.places/' + encodeURIComponent(q) + '.json?country=CZ&language=cs&limit=5&access_token=' + MBTOKEN;
    const res = await fetch(url);
    const data = await res.json();
    showAC(data.features||[]);
  } catch(e) { acBox.classList.remove('vis'); }
}
function showAC(features) {
  if (!features.length) { acBox.classList.remove('vis'); return; }
  acBox.innerHTML = features.map((f,i) => {
    const main = f.text||f.place_name;
    const sub  = f.place_name.replace(main+', ','');
    return '<div class="ac-item" data-i="' + i + '"><span class="ac-icon">📍</span><div><div class="ac-main">' + main + '</div><div class="ac-sub">' + sub + '</div></div></div>';
  }).join('');
  acBox.classList.add('vis');
  acBox.querySelectorAll('.ac-item').forEach((el,i) => {
    el.addEventListener('click', () => {
      const f=features[i];
      const [lng,lat]=f.center;
      addrInput.value=f.place_name.split(',')[0];
      addrClear.classList.add('vis');
      acBox.classList.remove('vis'); addrInput.blur();
      map.flyTo({center:[lng,lat],zoom:13.5,duration:1300});
      setUserPos(lng,lat);
    });
  });
}
document.addEventListener('click', e => { if (!e.target.closest('.search-wrap')) acBox.classList.remove('vis'); });

// ── TOAST ────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}

// ── MAP INIT ─────────────────────────────────────────────────────
mapboxgl.accessToken = MBTOKEN;
map = new mapboxgl.Map({
  container:'map', style:'mapbox://styles/mapbox/dark-v11',
  center:[15.3,49.8], zoom:7.2, attributionControl:false, logoPosition:'bottom-right',
});
map.addControl(new mapboxgl.NavigationControl({showCompass:true,visualizePitch:false}),'top-right');
map.on('click', ()=>{ hidePanel(); acBox.classList.remove('vis'); });
map.on('load', () => {
  STATIONS = STATIONS_ALL;
  refreshMarkers();
  locateUser();
  const h = document.getElementById('header').offsetHeight;
  document.documentElement.style.setProperty('--header-h', h+'px');

});
window.addEventListener('resize', () => {
  const h=document.getElementById('header').offsetHeight;
  document.documentElement.style.setProperty('--header-h',h+'px');
});
</script>
