name: Denní aktualizace cen PHM

on:
  schedule:
    # Každý den v 6:30 ráno (UTC = 7:30 nebo 8:30 SEČ/SELČ)
    - cron: '30 6 * * *'
  # Možnost spustit ručně z GitHub UI
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Potřeba pro commit

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastav Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Spusť scraper cen
        run: python update_prices.py index.html

      - name: Zkontroluj změny
        id: changes
        run: |
          git diff --quiet index.html && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commituj a pushni aktualizaci
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "🔄 Aktualizace cen PHM – $(date '+%d. %m. %Y')"
          git push
